# YOLOv8 dataset configuration
# Digital Tailor System — Garment Detection

path: C:\Research\Developing\digital-tailor-system\ai_training\dataset          # root dataset directory
train: images/train      # training images
val:   images/val        # validation images
test:  images/test       # test images (optional)

# Number of classes
nc: 6

# Class names — sleeves and necklines
names:
  0: short-sleeve
  1: long-sleeve
  2: sleeveless
  3: one-shoulder
  4: round-neck
  5: v-neck
